version: "3.9"

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./backend:/app
  networks:
    - aurevia_net

services:
  postgres:
    image: postgres:15-alpine
    container_name: aurevia_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurevia}
      POSTGRES_USER: ${POSTGRES_USER:-aurevia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurevia_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurevia_user} -d ${POSTGRES_DB:-aurevia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aurevia_net

  redis:
    image: redis:7-alpine
    container_name: aurevia_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurevia_net

  backend:
    <<: *backend-base
    container_name: aurevia_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-worker:
    <<: *backend-base
    container_name: aurevia_celery_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 --queues=default,imports,marketplace,ai,email --hostname=worker@%h

  celery-beat:
    <<: *backend-base
    container_name: aurevia_celery_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info

  flower:
    <<: *backend-base
    container_name: aurevia_flower
    restart: unless-stopped
    command: celery -A app.workers.celery_app flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flowerpass}
    ports:
      - "${FLOWER_PORT:-5555}:5555"

volumes:
  postgres_data:
  redis_data:

networks:
  aurevia_net:
    driver: bridge
